name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apple-reminders-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PLUGIN_ROOT: plugins/apple-reminders
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard new commit identity privacy
        env:
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # PR commits are fully checked before merge. On a push, GitHub may
          # synthesize a commit author from the account's public email setting;
          # retain the machine-local email guard without rejecting that
          # platform-generated metadata.
          AUDIT_PROTECTED_NAME: ${{ github.event_name == 'pull_request' && 'Oscar-V4' || '' }}
        run: >-
          python3 scripts/audit_commit_identity.py
          --base "$AUDIT_BASE_SHA"
          --head "$AUDIT_HEAD_SHA"
          --protected-name "$AUDIT_PROTECTED_NAME"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate plugin manifest, MCP, skills, and evals
        run: python3 scripts/validate_plugin.py "$PLUGIN_ROOT"

      - name: Validate portable Minis export
        run: python3 scripts/validate_minis_export.py

      - name: Audit runtime source allowlist
        run: >-
          python3 scripts/audit_source_package.py "$PLUGIN_ROOT"
          --strict-worktree --verify-root-document-mirrors

      - name: Compile all Python source in memory
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          paths = sorted(
              path for path in root.rglob("*.py")
              if ".git" not in path.relative_to(root).parts
          )
          for path in paths:
              source = path.read_text(encoding="utf-8")
              compile(source, str(path.relative_to(root)), "exec")
          print(f"Compiled {len(paths)} Python source files without bytecode output")
          PY

      - name: Validate EventKit request contract without live access
        run: |
          printf '%s\n' '{"schema_version":1,"operation":"capabilities"}' | \
            python3 "$PLUGIN_ROOT/scripts/eventkit_bridge.py" --validate-only

      - name: Run all synthetic unit and packaging tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check ReminderKit helper syntax without linking
        run: |
          clang -x objective-c -fobjc-arc \
            -framework Foundation -framework AppKit -framework ImageIO \
            -fsyntax-only "$PLUGIN_ROOT/scripts/remkit_attach_image.m"
          clang -x objective-c -fobjc-arc \
            -framework Foundation -framework AppKit \
            -fsyntax-only "$PLUGIN_ROOT/scripts/remkit_sections.m"
          clang -x objective-c -fobjc-arc \
            -framework Foundation \
            -fsyntax-only "$PLUGIN_ROOT/scripts/remkit_recover.m"

      - name: Check EventKit helper syntax without linking
        run: >-
          clang -x objective-c -fobjc-arc
          -framework Foundation -framework EventKit
          -fsyntax-only "$PLUGIN_ROOT/scripts/reminders_eventkit.m"

      - name: Validate EventKit helper plist
        run: plutil -lint "$PLUGIN_ROOT/scripts/eventkit_bridge_info.plist"

      - name: Prove deterministic source packaging
        run: |
          mkdir -p "$RUNNER_TEMP/package-a" "$RUNNER_TEMP/package-b"
          python3 scripts/build_source_package.py "$PLUGIN_ROOT" \
            --output-directory "$RUNNER_TEMP/package-a" > "$RUNNER_TEMP/package-a.json"
          python3 scripts/build_source_package.py "$PLUGIN_ROOT" \
            --output-directory "$RUNNER_TEMP/package-b" > "$RUNNER_TEMP/package-b.json"
          cmp "$RUNNER_TEMP/package-a/"*.zip "$RUNNER_TEMP/package-b/"*.zip
          python3 scripts/audit_source_package.py "$PLUGIN_ROOT" \
            --archive "$RUNNER_TEMP/package-a/"*.zip
          shasum -a 256 "$RUNNER_TEMP/package-a/"*.zip

      - name: Confirm checks left no forbidden source artifacts
        run: >-
          python3 scripts/audit_source_package.py "$PLUGIN_ROOT"
          --strict-worktree --verify-root-document-mirrors

  bundled-runtime-tests:
    name: Bundled runtime (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PLUGIN_ROOT: plugins/apple-reminders
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect assembled runtime capsules
        id: runtime
        shell: bash
        run: |
          if [[ -f "$PLUGIN_ROOT/runtime/SHA256SUMS" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Runtime infrastructure only; no distribution capsules assembled.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.runtime.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Verify signed capsule on its native CPU
        if: steps.runtime.outputs.present == 'true'
        run: |
          python3 scripts/verify_python_runtime.py \
            --archive "$PLUGIN_ROOT/runtime/python-runtime-macos-${{ matrix.architecture }}.zip" \
            --manifest "$PLUGIN_ROOT/runtime/python-runtime-build-${{ matrix.architecture }}.json" \
            --architecture '${{ matrix.architecture }}' --expected-team-id V8347N9346 \
            --require-developer-id --require-notarized --run-probes \
            --plugin-root "$PLUGIN_ROOT" --extract-to "$RUNNER_TEMP/bundled runtime"
      - name: Run the complete suite with the bundled interpreter
        if: steps.runtime.outputs.present == 'true'
        shell: bash
        run: |
          export APPLE_REMINDERS_TEST_RUNTIME_APP="$RUNNER_TEMP/bundled runtime/AppleRemindersPythonRuntime.app"
          "$APPLE_REMINDERS_TEST_RUNTIME_APP/Contents/MacOS/apple-reminders-python" \
            -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify the tested runtime remains pristine
        if: ${{ !cancelled() && steps.runtime.outputs.present == 'true' }}
        run: |
          python3 scripts/verify_python_runtime.py \
            --app "$RUNNER_TEMP/bundled runtime/AppleRemindersPythonRuntime.app" \
            --manifest "$PLUGIN_ROOT/runtime/python-runtime-build-${{ matrix.architecture }}.json" \
            --architecture '${{ matrix.architecture }}' --expected-team-id V8347N9346 \
            --require-developer-id --require-notarized
      - name: Confirm the assembled package remains clean
        if: steps.runtime.outputs.present == 'true'
        run: >-
          python3 scripts/audit_source_package.py "$PLUGIN_ROOT"
          --strict-worktree --verify-root-document-mirrors
