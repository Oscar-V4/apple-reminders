name: Prepare signed EventKit helper

run-name: Prepare signed EventKit helper for ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-reminders-release-signing
  cancel-in-progress: false

jobs:
  test-and-build-unsigned:
    name: Test source and build unsigned candidate
    if: >-
      github.repository == 'Oscar-V4/apple-reminders' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      unsigned_zip_sha256: ${{ steps.unsigned-metadata.outputs.unsigned_zip_sha256 }}
      unsigned_context_sha256: ${{ steps.unsigned-metadata.outputs.unsigned_context_sha256 }}
    env:
      PLUGIN_ROOT: plugins/apple-reminders
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Prove the source commit and unreleased version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Oscar-V4/apple-reminders" ]]
          [[ "$GITHUB_REF_TYPE" == "branch" ]]
          [[ "$GITHUB_REF_NAME" == "${{ github.event.repository.default_branch }}" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
          [[ "$(git rev-parse "origin/${{ github.event.repository.default_branch }}")" == "$GITHUB_SHA" ]]
          plugin_version="$(
            python3 -c 'import json; print(json.load(open("plugins/apple-reminders/.codex-plugin/plugin.json"))["version"])'
          )"
          [[ "$plugin_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if git show-ref --verify --quiet "refs/tags/v$plugin_version"; then
            printf 'Refusing to prepare an already tagged plugin version\n' >&2
            exit 1
          fi

      - name: Validate public plugin source
        run: |
          set -euo pipefail
          python3 scripts/validate_plugin.py "$PLUGIN_ROOT"
          python3 scripts/audit_source_package.py "$PLUGIN_ROOT" \
            --strict-worktree --verify-root-document-mirrors
          plutil -lint "$PLUGIN_ROOT/scripts/eventkit_bridge_info.plist"
          plutil -lint scripts/eventkit_helper_app_info.plist

      - name: Run synthetic tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build, execute, and bind the ad-hoc candidate
        id: unsigned-metadata
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          build_root="$RUNNER_TEMP/apple-reminders-unsigned-build"
          artifact_root="$RUNNER_TEMP/apple-reminders-unsigned-artifact"
          app="$build_root/AppleRemindersEventKitHelper.app"
          context="$artifact_root/unsigned-build-context.json"
          archive="$artifact_root/AppleRemindersEventKitHelper-unsigned-$GITHUB_SHA.zip"
          checksums="$artifact_root/SHA256SUMS"
          rm -rf "$build_root" "$artifact_root"
          mkdir -p "$build_root" "$artifact_root"

          python3 scripts/build_eventkit_helper_app.py \
            --plugin-root "$PLUGIN_ROOT" \
            --output-app "$app" \
            --identity -
          python3 scripts/verify_eventkit_helper.py \
            --plugin-root "$PLUGIN_ROOT" \
            --app "$app" \
            --run-protocol-probes \
            --write-manifest "$context" \
            --source-commit "$GITHUB_SHA"

          python3 - "$app" "$archive" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          app = Path(sys.argv[1])
          archive = Path(sys.argv[2])
          expected = {
              "AppleRemindersEventKitHelper.app/Contents/Info.plist": 0o100644,
              "AppleRemindersEventKitHelper.app/Contents/MacOS/apple-reminders-eventkit-helper": 0o100755,
              "AppleRemindersEventKitHelper.app/Contents/_CodeSignature/CodeResources": 0o100644,
          }
          actual = {
              path.relative_to(app.parent).as_posix()
              for path in app.rglob("*")
              if path.is_file() or path.is_symlink()
          }
          if actual != set(expected):
              raise SystemExit(
                  f"unsigned helper inventory drift: expected {sorted(expected)}, got {sorted(actual)}"
              )
          with zipfile.ZipFile(archive, "x", compression=zipfile.ZIP_STORED) as handle:
              for name in sorted(expected):
                  source = app.parent / name
                  if source.is_symlink() or not source.is_file():
                      raise SystemExit(f"unsafe unsigned helper member: {name}")
                  mode = stat.S_IFMT(source.stat().st_mode) | stat.S_IMODE(source.stat().st_mode)
                  if mode != expected[name]:
                      raise SystemExit(
                          f"unsigned helper mode drift for {name}: {mode:o}"
                      )
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_STORED
                  info.external_attr = (expected[name] & 0xFFFF) << 16
                  handle.writestr(info, source.read_bytes())
          PY

          (
            cd "$artifact_root"
            shasum -a 256 \
              "$(basename "$archive")" \
              "$(basename "$context")" > "$checksums"
            shasum -a 256 -c "$checksums"
          )
          unsigned_zip_sha256="$(
            shasum -a 256 "$archive" | awk '{print $1}'
          )"
          unsigned_context_sha256="$(
            shasum -a 256 "$context" | awk '{print $1}'
          )"
          printf 'unsigned_zip_sha256=%s\n' "$unsigned_zip_sha256" >> "$GITHUB_OUTPUT"
          printf 'unsigned_context_sha256=%s\n' "$unsigned_context_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-reminders-eventkit-unsigned-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apple-reminders-unsigned-artifact/AppleRemindersEventKitHelper-unsigned-${{ github.sha }}.zip
            ${{ runner.temp }}/apple-reminders-unsigned-artifact/unsigned-build-context.json
            ${{ runner.temp }}/apple-reminders-unsigned-artifact/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  sign-notarize-and-staple:
    name: Protected signing boundary
    needs: test-and-build-unsigned
    if: >-
      github.repository == 'Oscar-V4/apple-reminders' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: release-signing
    permissions:
      contents: read
    outputs:
      signed_zip_sha256: ${{ steps.sign.outputs.signed_zip_sha256 }}
      signed_manifest_sha256: ${{ steps.sign.outputs.signed_manifest_sha256 }}
      signed_checksums_sha256: ${{ steps.sign.outputs.signed_checksums_sha256 }}
    steps:
      - name: Download exact unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apple-reminders-eventkit-unsigned-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-reminders-unsigned-download

      - name: Sign, notarize, staple, and destroy credentials
        id: sign
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12_B64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_B64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          EXPECTED_UNSIGNED_ZIP_SHA256: ${{ needs.test-and-build-unsigned.outputs.unsigned_zip_sha256 }}
          EXPECTED_UNSIGNED_CONTEXT_SHA256: ${{ needs.test-and-build-unsigned.outputs.unsigned_context_sha256 }}
          UNSIGNED_DOWNLOAD_ROOT: ${{ runner.temp }}/apple-reminders-unsigned-download
          SIGNED_WORK_ROOT: ${{ runner.temp }}/apple-reminders-protected-signing-work
          SIGNING_CREDENTIALS_ROOT: ${{ runner.temp }}/apple-reminders-signing-credentials
          SIGNED_ARTIFACT_ROOT: ${{ runner.temp }}/apple-reminders-signed-staging
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == "Oscar-V4/apple-reminders" ]]
          [[ "$GITHUB_REF_TYPE" == "branch" ]]
          [[ "$GITHUB_REF_NAME" == "${{ github.event.repository.default_branch }}" ]]

          unsigned_zip="$UNSIGNED_DOWNLOAD_ROOT/AppleRemindersEventKitHelper-unsigned-$GITHUB_SHA.zip"
          unsigned_context="$UNSIGNED_DOWNLOAD_ROOT/unsigned-build-context.json"
          unsigned_checksums="$UNSIGNED_DOWNLOAD_ROOT/SHA256SUMS"
          keychain_path="$SIGNING_CREDENTIALS_ROOT/release-signing.keychain-db"
          p12_path="$SIGNING_CREDENTIALS_ROOT/developer-id-application.p12"
          p8_path="$SIGNING_CREDENTIALS_ROOT/AuthKey.p8"
          original_keychains="$SIGNING_CREDENTIALS_ROOT/original-user-keychains.txt"
          app="$SIGNED_WORK_ROOT/AppleRemindersEventKitHelper.app"
          submission_zip="$SIGNED_WORK_ROOT/notary-submission.zip"
          notary_result="$SIGNING_CREDENTIALS_ROOT/notary-result.json"
          final_zip="$SIGNED_ARTIFACT_ROOT/AppleRemindersEventKitHelper-notarized.zip"
          final_manifest="$SIGNED_ARTIFACT_ROOT/eventkit-helper-build.json"
          final_checksums="$SIGNED_ARTIFACT_ROOT/SHA256SUMS"

          restore_keychain_search_list() {
            local keychain
            local restored=()
            if [[ -f "$original_keychains" ]]; then
              while IFS= read -r keychain; do
                [[ -n "$keychain" ]] && restored+=("$keychain")
              done < "$original_keychains"
              if ((${#restored[@]})); then
                security list-keychains -d user -s "${restored[@]}" >/dev/null 2>&1 || true
              fi
            fi
          }

          cleanup() {
            set +e
            restore_keychain_search_list
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -rf "$SIGNING_CREDENTIALS_ROOT" "$SIGNED_WORK_ROOT"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          for variable_name in \
            APPLE_DEVELOPER_ID_P12_B64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_P8_B64 \
            APPLE_TEAM_ID \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            EXPECTED_UNSIGNED_ZIP_SHA256 \
            EXPECTED_UNSIGNED_CONTEXT_SHA256; do
            if [[ -z "${!variable_name:-}" ]]; then
              printf 'Required protected-signing value is missing: %s\n' "$variable_name" >&2
              exit 1
            fi
          done
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            printf 'APPLE_TEAM_ID has an unexpected format\n' >&2
            exit 1
          }
          [[ "$APPLE_TEAM_ID" == "V8347N9346" ]] || {
            printf 'APPLE_TEAM_ID does not match the canonical publisher\n' >&2
            exit 1
          }
          [[ "$APPLE_NOTARY_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            printf 'APPLE_NOTARY_KEY_ID has an unexpected format\n' >&2
            exit 1
          }
          [[ "$APPLE_NOTARY_ISSUER_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] || {
            printf 'APPLE_NOTARY_ISSUER_ID has an unexpected format\n' >&2
            exit 1
          }
          [[ "$EXPECTED_UNSIGNED_ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_UNSIGNED_CONTEXT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ ! -e "$SIGNED_WORK_ROOT" && ! -e "$SIGNING_CREDENTIALS_ROOT" && ! -e "$SIGNED_ARTIFACT_ROOT" ]] || {
            printf 'Refusing to overwrite protected signing paths\n' >&2
            exit 1
          }
          mkdir -m 0700 -p \
            "$SIGNED_WORK_ROOT" \
            "$SIGNING_CREDENTIALS_ROOT" \
            "$SIGNED_ARTIFACT_ROOT"

          python3 - \
            "$UNSIGNED_DOWNLOAD_ROOT" \
            "$unsigned_zip" \
            "$unsigned_context" \
            "$EXPECTED_UNSIGNED_ZIP_SHA256" \
            "$EXPECTED_UNSIGNED_CONTEXT_SHA256" \
            "$GITHUB_SHA" \
            "$SIGNED_WORK_ROOT" <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import sys
          import zipfile
          from pathlib import Path

          artifact_root = Path(sys.argv[1])
          archive = Path(sys.argv[2])
          context_path = Path(sys.argv[3])
          expected_archive_hash = sys.argv[4]
          expected_context_hash = sys.argv[5]
          source_commit = sys.argv[6]
          output_root = Path(sys.argv[7])
          expected_artifacts = {
              archive.name,
              context_path.name,
              "SHA256SUMS",
          }
          actual_artifacts = {path.name for path in artifact_root.iterdir()}
          if actual_artifacts != expected_artifacts:
              raise SystemExit(
                  f"unsigned artifact set drift: expected {sorted(expected_artifacts)}, got {sorted(actual_artifacts)}"
              )

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          if digest(archive) != expected_archive_hash:
              raise SystemExit("unsigned ZIP digest does not match Job 1 output")
          if digest(context_path) != expected_context_hash:
              raise SystemExit("unsigned context digest does not match Job 1 output")
          checksum_lines = (artifact_root / "SHA256SUMS").read_text(
              encoding="utf-8"
          ).splitlines()
          expected_checksum_lines = [
              f"{expected_archive_hash}  {archive.name}",
              f"{expected_context_hash}  {context_path.name}",
          ]
          if checksum_lines != expected_checksum_lines:
              raise SystemExit("unsigned checksum file does not match Job 1 outputs")
          context = json.loads(context_path.read_text(encoding="utf-8"))
          if context.get("source_commit") != source_commit:
              raise SystemExit("unsigned context source commit drift")
          version = context.get("plugin_version")
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("unsigned context plugin version is invalid")
          if context.get("signature") != "unchecked":
              raise SystemExit("unsigned context signature state drift")
          expected_source_keys = {
              ".codex-plugin/plugin.json",
              "scripts/eventkit_bridge_schema.json",
              "scripts/reminders_eventkit.m",
          }
          expected_build_keys = {
              ".github/workflows/prepare-signed-helper.yml",
              "scripts/build_eventkit_helper_app.py",
              "scripts/eventkit_helper_app_info.plist",
              "scripts/prepare_signed_eventkit_helper.sh",
              "scripts/verify_eventkit_helper.py",
          }
          for field, expected_keys in (
              ("source_files", expected_source_keys),
              ("build_inputs", expected_build_keys),
          ):
              values = context.get(field)
              if not isinstance(values, dict) or set(values) != expected_keys:
                  raise SystemExit(f"unsigned context {field} inventory drift")
              if any(not re.fullmatch(r"[0-9a-f]{64}", value) for value in values.values()):
                  raise SystemExit(f"unsigned context {field} contains an invalid digest")

          expected_members = {
              "AppleRemindersEventKitHelper.app/Contents/Info.plist": (0o100644, 128 * 1024),
              "AppleRemindersEventKitHelper.app/Contents/MacOS/apple-reminders-eventkit-helper": (0o100755, 16 * 1024 * 1024),
              "AppleRemindersEventKitHelper.app/Contents/_CodeSignature/CodeResources": (0o100644, 2 * 1024 * 1024),
          }
          with zipfile.ZipFile(archive) as handle:
              infos = handle.infolist()
              names = [info.filename for info in infos]
              if len(names) != len(set(names)) or set(names) != set(expected_members):
                  raise SystemExit("unsigned ZIP central-directory inventory drift")
              if sum(info.file_size for info in infos) > 20 * 1024 * 1024:
                  raise SystemExit("unsigned ZIP exceeds the total size budget")
              for info in infos:
                  name = info.filename
                  if (
                      name.startswith("/")
                      or "\\" in name
                      or ".." in Path(name).parts
                      or info.is_dir()
                  ):
                      raise SystemExit(f"unsafe unsigned ZIP member: {name}")
                  expected_mode, maximum_size = expected_members[name]
                  mode = info.external_attr >> 16
                  if stat.S_IFMT(mode) != stat.S_IFREG or mode != expected_mode:
                      raise SystemExit(f"unsafe unsigned ZIP member mode: {name}")
                  if info.file_size <= 0 or info.file_size > maximum_size:
                      raise SystemExit(f"unsafe unsigned ZIP member size: {name}")
                  destination = output_root / name
                  destination.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                  data = handle.read(info)
                  destination.write_bytes(data)
                  destination.chmod(stat.S_IMODE(expected_mode))
              if handle.testzip() is not None:
                  raise SystemExit("unsigned ZIP CRC validation failed")
          app_hashes = {
              name: digest(output_root / name)
              for name in sorted(expected_members)
          }
          if context.get("app_files") != app_hashes:
              raise SystemExit("unsigned context app hashes do not match extracted bytes")
          for directory in sorted(
              (path for path in output_root.rglob("*") if path.is_dir()),
              key=lambda item: len(item.parts),
              reverse=True,
          ):
              directory.chmod(0o755)
          PY

          info_path="$app/Contents/Info.plist"
          binary="$app/Contents/MacOS/apple-reminders-eventkit-helper"
          plugin_version="$(
            plutil -extract plugin_version raw -o - "$unsigned_context"
          )"
          plist_value() {
            plutil -extract "$1" raw -o - "$info_path"
          }
          [[ "$(plist_value CFBundleIdentifier)" == "io.github.oscar-v4.apple-reminders.eventkit-bridge" ]]
          [[ "$(plist_value CFBundleExecutable)" == "apple-reminders-eventkit-helper" ]]
          [[ "$(plist_value CFBundlePackageType)" == "APPL" ]]
          [[ "$(plist_value CFBundleShortVersionString)" == "$plugin_version" ]]
          [[ "$(plist_value CFBundleVersion)" == "$plugin_version" ]]
          [[ "$(plist_value LSMinimumSystemVersion)" == "14.0" ]]
          [[ -n "$(plist_value NSRemindersFullAccessUsageDescription)" ]]
          actual_architectures="$(
            xcrun lipo -archs "$binary" | tr ' ' '\n' | sort | tr '\n' ' '
          )"
          [[ "$actual_architectures" == "arm64 x86_64 " ]]
          for architecture in arm64 x86_64; do
            minimum="$(
              xcrun vtool -show-build -arch "$architecture" "$binary" |
                awk '$1 == "minos" {print $2}'
            )"
            [[ "$minimum" == "14.0" ]]
          done

          python3 - "$p12_path" APPLE_DEVELOPER_ID_P12_B64 "$p8_path" APPLE_NOTARY_KEY_P8_B64 <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path

          for destination_arg, environment_name in ((1, sys.argv[2]), (3, sys.argv[4])):
              destination = Path(sys.argv[destination_arg])
              encoded = "".join(os.environ[environment_name].split())
              destination.write_bytes(base64.b64decode(encoded, validate=True))
              destination.chmod(0o600)
          PY
          grep -q '^-----BEGIN PRIVATE KEY-----$' "$p8_path" || {
            printf 'Decoded notarization key is invalid\n' >&2
            exit 1
          }

          security list-keychains -d user |
            sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$original_keychains"
          keychain_password="$(
            python3 -c 'import secrets; print(secrets.token_urlsafe(36))'
          )"
          printf '::add-mask::%s\n' "$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk '/Developer ID Application:/ {print $2}'
          )"
          [[ "$(printf '%s\n' "$signing_identity" | awk 'NF {count++} END {print count+0}')" == 1 ]] || {
            printf 'Expected exactly one valid Developer ID Application identity\n' >&2
            exit 1
          }
          unset APPLE_DEVELOPER_ID_P12_B64 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_KEY_P8_B64
          rm -f "$p12_path"

          (
            umask 022
            codesign --remove-signature "$app"
            codesign \
              --force \
              --options runtime \
              --timestamp \
              --sign "$signing_identity" \
              "$app"
          )
          codesign --verify --deep --strict --verbose=2 "$app"
          signing_details="$(
            codesign -dvvv "$app" 2>&1
          )"
          grep -Fq 'Identifier=io.github.oscar-v4.apple-reminders.eventkit-bridge' <<<"$signing_details"
          grep -Fq "TeamIdentifier=$APPLE_TEAM_ID" <<<"$signing_details"
          grep -Fq 'flags=0x10000(runtime)' <<<"$signing_details"
          grep -Fq 'Timestamp=' <<<"$signing_details"

          ditto -c -k --keepParent "$app" "$submission_zip"
          xcrun notarytool submit "$submission_zip" \
            --key "$p8_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$notary_result"
          python3 - "$notary_result" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if result.get("status") != "Accepted":
              raise SystemExit("Apple notarization did not return Accepted")
          PY
          (
            umask 022
            xcrun stapler staple "$app"
          )
          xcrun stapler validate "$app"
          rm -f "$p8_path" "$notary_result" "$submission_zip"

          python3 - \
            "$app" \
            "$unsigned_context" \
            "$GITHUB_SHA" \
            "$APPLE_TEAM_ID" \
            "$final_manifest" \
            "$final_zip" <<'PY'
          import hashlib
          import json
          import stat
          import sys
          import zipfile
          from pathlib import Path

          app = Path(sys.argv[1])
          context = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          source_commit = sys.argv[3]
          team_id = sys.argv[4]
          manifest_path = Path(sys.argv[5])
          archive = Path(sys.argv[6])
          expected = {
              "AppleRemindersEventKitHelper.app/Contents/CodeResources": 0o100644,
              "AppleRemindersEventKitHelper.app/Contents/Info.plist": 0o100644,
              "AppleRemindersEventKitHelper.app/Contents/MacOS/apple-reminders-eventkit-helper": 0o100755,
              "AppleRemindersEventKitHelper.app/Contents/_CodeSignature/CodeResources": 0o100644,
          }

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          actual = {
              path.relative_to(app.parent).as_posix()
              for path in app.rglob("*")
              if path.is_file() or path.is_symlink()
          }
          if actual != set(expected):
              raise SystemExit(
                  f"stapled helper inventory drift: expected {sorted(expected)}, got {sorted(actual)}"
              )
          app_files = {}
          with zipfile.ZipFile(archive, "x", compression=zipfile.ZIP_STORED) as handle:
              for name in sorted(expected):
                  source = app.parent / name
                  if source.is_symlink() or not source.is_file():
                      raise SystemExit(f"unsafe stapled helper member: {name}")
                  mode = stat.S_IFMT(source.stat().st_mode) | stat.S_IMODE(source.stat().st_mode)
                  if mode != expected[name]:
                      raise SystemExit(f"stapled helper mode drift for {name}: {mode:o}")
                  app_files[name] = digest(source)
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_STORED
                  info.external_attr = (expected[name] & 0xFFFF) << 16
                  handle.writestr(info, source.read_bytes())

          context.update(
              {
                  "app_files": app_files,
                  "binary_sha256": app_files[
                      "AppleRemindersEventKitHelper.app/Contents/MacOS/apple-reminders-eventkit-helper"
                  ],
                  "notarization_checked": True,
                  "notarized": True,
                  "signature": "developer-id",
                  "source_commit": source_commit,
                  "team_id": team_id,
              }
          )
          manifest_path.write_text(
              json.dumps(context, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$SIGNED_ARTIFACT_ROOT"
            shasum -a 256 \
              "$(basename "$final_zip")" \
              "$(basename "$final_manifest")" > "$final_checksums"
            shasum -a 256 -c "$final_checksums"
          )
          signed_zip_sha256="$(
            shasum -a 256 "$final_zip" | awk '{print $1}'
          )"
          signed_manifest_sha256="$(
            shasum -a 256 "$final_manifest" | awk '{print $1}'
          )"
          signed_checksums_sha256="$(
            shasum -a 256 "$final_checksums" | awk '{print $1}'
          )"

          cleanup
          set -e
          trap - EXIT
          [[ ! -e "$SIGNING_CREDENTIALS_ROOT" && ! -e "$SIGNED_WORK_ROOT" ]]
          printf 'signed_zip_sha256=%s\n' "$signed_zip_sha256" >> "$GITHUB_OUTPUT"
          printf 'signed_manifest_sha256=%s\n' "$signed_manifest_sha256" >> "$GITHUB_OUTPUT"
          printf 'signed_checksums_sha256=%s\n' "$signed_checksums_sha256" >> "$GITHUB_OUTPUT"

      - name: Confirm protected credentials are gone
        shell: bash
        env:
          SIGNED_WORK_ROOT: ${{ runner.temp }}/apple-reminders-protected-signing-work
          SIGNING_CREDENTIALS_ROOT: ${{ runner.temp }}/apple-reminders-signing-credentials
          SIGNED_ARTIFACT_ROOT: ${{ runner.temp }}/apple-reminders-signed-staging
        run: |
          set -euo pipefail
          [[ ! -e "$SIGNING_CREDENTIALS_ROOT" ]]
          [[ ! -e "$SIGNED_WORK_ROOT" ]]
          [[ -d "$SIGNED_ARTIFACT_ROOT" ]]
          [[ "$(find "$SIGNED_ARTIFACT_ROOT" -maxdepth 1 -type f | wc -l | tr -d ' ')" == 3 ]]

      - name: Upload immutable signed staging artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-reminders-eventkit-signed-staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apple-reminders-signed-staging/AppleRemindersEventKitHelper-notarized.zip
            ${{ runner.temp }}/apple-reminders-signed-staging/eventkit-helper-build.json
            ${{ runner.temp }}/apple-reminders-signed-staging/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  verify-attest-and-publish-candidate:
    name: Verify and attest without signing secrets
    needs: sign-notarize-and-staple
    if: >-
      github.repository == 'Oscar-V4/apple-reminders' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PLUGIN_ROOT: plugins/apple-reminders
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      SIGNED_ARTIFACT_ROOT: artifacts/signed-eventkit-helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download exact signed staging artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apple-reminders-eventkit-signed-staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SIGNED_ARTIFACT_ROOT }}

      - name: Validate digests and safely extract
        shell: bash
        env:
          EXPECTED_SIGNED_ZIP_SHA256: ${{ needs.sign-notarize-and-staple.outputs.signed_zip_sha256 }}
          EXPECTED_SIGNED_MANIFEST_SHA256: ${{ needs.sign-notarize-and-staple.outputs.signed_manifest_sha256 }}
          EXPECTED_SIGNED_CHECKSUMS_SHA256: ${{ needs.sign-notarize-and-staple.outputs.signed_checksums_sha256 }}
        run: |
          set -euo pipefail
          archive="$SIGNED_ARTIFACT_ROOT/AppleRemindersEventKitHelper-notarized.zip"
          manifest="$SIGNED_ARTIFACT_ROOT/eventkit-helper-build.json"
          checksums="$SIGNED_ARTIFACT_ROOT/SHA256SUMS"
          verification_root="$RUNNER_TEMP/apple-reminders-signed-verification"
          [[ "$(shasum -a 256 "$archive" | awk '{print $1}')" == "$EXPECTED_SIGNED_ZIP_SHA256" ]]
          [[ "$(shasum -a 256 "$manifest" | awk '{print $1}')" == "$EXPECTED_SIGNED_MANIFEST_SHA256" ]]
          [[ "$(shasum -a 256 "$checksums" | awk '{print $1}')" == "$EXPECTED_SIGNED_CHECKSUMS_SHA256" ]]
          (
            cd "$SIGNED_ARTIFACT_ROOT"
            shasum -a 256 -c SHA256SUMS
          )
          rm -rf "$verification_root"
          mkdir -m 0700 "$verification_root"
          python3 - "$archive" "$verification_root" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          output_root = Path(sys.argv[2])
          expected = {
              "AppleRemindersEventKitHelper.app/Contents/CodeResources": (0o100644, 2 * 1024 * 1024),
              "AppleRemindersEventKitHelper.app/Contents/Info.plist": (0o100644, 128 * 1024),
              "AppleRemindersEventKitHelper.app/Contents/MacOS/apple-reminders-eventkit-helper": (0o100755, 16 * 1024 * 1024),
              "AppleRemindersEventKitHelper.app/Contents/_CodeSignature/CodeResources": (0o100644, 2 * 1024 * 1024),
          }
          with zipfile.ZipFile(archive) as handle:
              infos = handle.infolist()
              names = [info.filename for info in infos]
              if len(names) != len(set(names)) or set(names) != set(expected):
                  raise SystemExit("signed ZIP central-directory inventory drift")
              if sum(info.file_size for info in infos) > 20 * 1024 * 1024:
                  raise SystemExit("signed ZIP exceeds the total size budget")
              for info in infos:
                  name = info.filename
                  if (
                      name.startswith("/")
                      or "\\" in name
                      or ".." in Path(name).parts
                      or info.is_dir()
                  ):
                      raise SystemExit(f"unsafe signed ZIP member: {name}")
                  expected_mode, maximum_size = expected[name]
                  mode = info.external_attr >> 16
                  if stat.S_IFMT(mode) != stat.S_IFREG or mode != expected_mode:
                      raise SystemExit(f"unsafe signed ZIP member mode: {name}")
                  if info.file_size <= 0 or info.file_size > maximum_size:
                      raise SystemExit(f"unsafe signed ZIP member size: {name}")
                  destination = output_root / name
                  destination.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                  destination.write_bytes(handle.read(info))
                  destination.chmod(stat.S_IMODE(expected_mode))
              if handle.testzip() is not None:
                  raise SystemExit("signed ZIP CRC validation failed")
          for directory in sorted(
              (path for path in output_root.rglob("*") if path.is_dir()),
              key=lambda item: len(item.parts),
              reverse=True,
          ):
              directory.chmod(0o755)
          PY

      - name: Run full signed-helper verification
        env:
          APPLE_TEAM_ID: V8347N9346
        run: |
          set -euo pipefail
          python3 scripts/verify_eventkit_helper.py \
            --plugin-root "$PLUGIN_ROOT" \
            --app "$RUNNER_TEMP/apple-reminders-signed-verification/AppleRemindersEventKitHelper.app" \
            --expected-team-id "$APPLE_TEAM_ID" \
            --require-developer-id \
            --require-notarized \
            --run-protocol-probes \
            --manifest "$SIGNED_ARTIFACT_ROOT/eventkit-helper-build.json" \
            --source-commit "$GITHUB_SHA"

      - name: Attest the exact verified candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/signed-eventkit-helper/AppleRemindersEventKitHelper-notarized.zip
            artifacts/signed-eventkit-helper/eventkit-helper-build.json
            artifacts/signed-eventkit-helper/SHA256SUMS

      - name: Upload signed helper for human review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-reminders-eventkit-helper-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/signed-eventkit-helper/AppleRemindersEventKitHelper-notarized.zip
            artifacts/signed-eventkit-helper/eventkit-helper-build.json
            artifacts/signed-eventkit-helper/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
